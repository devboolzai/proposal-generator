# Anything that is not quote.boolzai.co.il or sign.boolzai.co.il ends here.
#
# ufw lets in every Cloudflare address, and any Cloudflare customer can point
# a hostname of their own at this IP. Without a default server, nginx would
# answer such a request from the first vhost it loaded (the generator),
# walking straight past the edge rule that guards quote.boolzai.co.il.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # Refuse the TLS handshake for any name we do not serve, before a
    # certificate or a byte of content is exchanged.
    ssl_reject_handshake on;
}
