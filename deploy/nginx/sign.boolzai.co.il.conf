server {
    listen 80;
    listen [::]:80;
    server_name sign.boolzai.co.il;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sign.boolzai.co.il;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /srv/proposal-sign/current/sign/dist;
    index index.html;

    access_log /var/log/nginx/sign.access.log;
    error_log  /var/log/nginx/sign.error.log;

    # Chunks are 5MB; the ceiling leaves room for headers and a retry that
    # rounds up. The per-kind caps are enforced in the handler.
    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # originOf() in shared/http.js reads these to build the signing link.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # A 30MB upload over tethering is slow by nature; do not cut it off.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The client's link is /s/<token>, which is not a file; the SPA's
    # main.jsx matches it client-side, so every unknown path gets index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
